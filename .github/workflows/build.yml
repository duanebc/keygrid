name: Build

# Packages on every push/PR without uploading anywhere, so a broken .toc or
# .pkgmeta is caught before a tag goes out. The zip is kept as an artifact.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d -l
          # -d skips every upload, -l skips the changelog

      - uses: actions/upload-artifact@v4
        with:
          name: KeyGrid-build
          path: .release/*.zip
          if-no-files-found: error
